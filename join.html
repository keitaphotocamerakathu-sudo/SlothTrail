<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าร่วมทีม | Trail RC MINI App</title><link rel="stylesheet" href="assets/app.css"></head><body>
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="./"><div class="brand-mark">RC</div><div>Join Team</div></a><div id="lineName" class="help">กำลังเชื่อม LINE...</div></div></header>
<main class="section"><div class="container" style="max-width:680px"><div class="panel card"><div class="eyebrow">LINE MINI App · Team Invite</div><h1 id="title">กำลังตรวจลิงก์เชิญ...</h1><p id="desc">กรุณารอสักครู่</p><div id="memberChoices"></div><button id="joinBtn" class="btn btn-primary" type="button" style="width:100%;display:none;margin-top:18px">เข้าร่วมทีมนี้</button><div id="statusBox" class="scan-status"></div></div></div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/common.js?v=20260909-raceentry1"></script><script src="js/line-miniapp.js?v=20260909-raceentry1"></script><script>
(async()=>{const UI=TrailUI,eventId=UI.qs('event'),teamCode=UI.qs('team'),hash=new URLSearchParams(location.hash.replace(/^#/,'')),joinKey=hash.get('key'),btn=document.getElementById('joinBtn');let mini=null,info=null;if(!eventId||!teamCode||!joinKey){document.getElementById('title').textContent='ลิงก์เชิญไม่ครบ';document.getElementById('desc').textContent='กรุณาขอลิงก์ใหม่จากหัวหน้าทีม';return;}try{mini=await TrailMiniApp.init();document.getElementById('lineName').textContent=mini.profile?.displayName?`LINE: ${mini.profile.displayName}`:'เชื่อม LINE แล้ว';const me=await TrailMiniApp.call('miniapp-api',{action:'me',event_id:eventId});if(me?.registered){document.getElementById('title').textContent=`คุณอยู่ใน ${me.team.team_code} แล้ว`;document.getElementById('desc').innerHTML=`บัญชี LINE นี้ถูกผูกกับทีมใน Event นี้แล้ว<br><a class="btn btn-primary" style="margin-top:14px" href="race.html?event=${encodeURIComponent(eventId)}">เปิด Race Mode</a>`;return;}info=await TrailMiniApp.call('miniapp-api',{action:'join_info',event_id:eventId,team_code:teamCode,team_join_key:joinKey});document.getElementById('title').textContent=`เข้าร่วม ${info.team.team_code} · ${info.team.team_name||'ทีม'}`;document.getElementById('desc').textContent=`${info.event.name} · เลือกชื่อของคุณในทีม`;const choices=document.getElementById('memberChoices');choices.innerHTML=info.members.map(m=>`<label class="card" style="display:flex;gap:12px;align-items:center;margin-top:10px;opacity:${m.claimed?'0.55':'1'}"><input type="radio" name="member" value="${m.member_order}" ${m.claimed?'disabled':''}><span><strong>${UI.esc(m.full_name)}</strong><br><span class="help">สมาชิกคนที่ ${m.member_order}${m.claimed?' · ผูก LINE แล้ว':''}</span></span></label>`).join('');btn.style.display='inline-flex';}catch(e){document.getElementById('title').textContent='ไม่สามารถเข้าร่วมทีมได้';document.getElementById('desc').textContent=e.message;return;}
btn.addEventListener('click',async()=>{const selected=document.querySelector('input[name="member"]:checked');if(!selected){UI.toast('กรุณาเลือกชื่อของคุณ','error');return;}btn.disabled=true;btn.textContent='กำลังเข้าร่วมทีม...';try{const data=await TrailMiniApp.call('miniapp-api',{action:'join',event_id:eventId,team_code:teamCode,team_join_key:joinKey,member_order:Number(selected.value)});document.getElementById('statusBox').textContent=`✅ ผูก LINE กับ ${data.team_code} สำเร็จ`;btn.style.display='none';document.getElementById('memberChoices').innerHTML=`<a class="btn btn-primary" style="width:100%" href="race.html?event=${encodeURIComponent(eventId)}">เปิด Race Mode</a>`;}catch(e){UI.toast(e.message,'error');btn.disabled=false;btn.textContent='เข้าร่วมทีมนี้';}});})();
</script></body></html>
