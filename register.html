<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครแข่งขัน | Trail RC MINI App</title><link rel="stylesheet" href="assets/app.css"></head><body>
<header class="topbar"><div class="container topbar-inner"><a class="brand" href="./"><div class="brand-mark">RC</div><div>Trail RC Registration</div></a><div id="miniIdentity" class="help">กำลังเชื่อม LINE...</div></div></header>
<main class="section"><div class="container" style="max-width:820px"><div id="eventHeader" class="panel card"><h1 style="margin:0 0 8px">กำลังโหลด Event...</h1></div><div id="existingBox" class="panel card" style="display:none;margin-top:14px"></div><form id="regForm" class="panel card" style="margin-top:14px;display:none"><div class="notice" style="margin-bottom:16px">บัญชี LINE ที่กำลังเปิด MINI App จะถูกผูกเป็นสมาชิกคนที่ 1 / หัวหน้าทีมโดยอัตโนมัติ</div><div class="form-grid"><div class="field full"><label>ชื่อทีม</label><input id="teamName" class="input" placeholder="ชื่อทีมของคุณ"></div><div id="teamCustomFields" class="field full"></div></div><div id="membersWrap"></div><div style="margin-top:18px"><button id="submitBtn" class="btn btn-primary" type="submit" style="width:100%">ส่งใบสมัคร</button></div></form><div id="resultBox" class="panel card" style="display:none;margin-top:14px"></div></div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/common.js"></script><script src="js/line-miniapp.js"></script><script>
(()=>{const db=trailDb,UI=TrailUI;let event=null,fields=[],mini=null;const slug=UI.qs('event');
function inputFor(f,prefix){const id=`${prefix}_${f.field_key}`,req=f.is_required?'required':'';if(['select','radio'].includes(f.field_type)){const opts=(f.options||[]).map(o=>`<option value="${UI.esc(o)}">${UI.esc(o)}</option>`).join('');return `<div class="field"><label>${UI.esc(f.label)}${f.is_required?' *':''}</label><select class="select custom-field" data-key="${UI.esc(f.field_key)}" id="${id}" ${req}><option value="">เลือก</option>${opts}</select></div>`}if(f.field_type==='checkbox')return `<div class="checkbox-row"><input class="custom-field" data-key="${UI.esc(f.field_key)}" id="${id}" type="checkbox"><label for="${id}">${UI.esc(f.label)}</label></div>`;const type=['number','date','tel','email'].includes(f.field_type)?f.field_type:'text';if(f.field_type==='textarea')return `<div class="field"><label>${UI.esc(f.label)}${f.is_required?' *':''}</label><textarea class="textarea custom-field" data-key="${UI.esc(f.field_key)}" id="${id}" ${req}></textarea></div>`;return `<div class="field"><label>${UI.esc(f.label)}${f.is_required?' *':''}</label><input class="input custom-field" data-key="${UI.esc(f.field_key)}" id="${id}" type="${type}" ${req}></div>`}
function collectCustom(root){const out={};root.querySelectorAll('.custom-field').forEach(el=>{out[el.dataset.key]=el.type==='checkbox'?el.checked:el.value});return out}
async function permanent(url){try{return await mini.liff.permanentLink.createUrlBy(url)}catch{return url}}
async function showExisting(data){const box=document.getElementById('existingBox');box.style.display='block';box.innerHTML=`<div class="eyebrow">สมัครไว้แล้ว</div><h2>${UI.esc(data.team.team_code)} · ${UI.esc(data.team.team_name||'ทีมของคุณ')}</h2><p>บัญชี LINE นี้ถูกผูกกับทีมใน Event นี้แล้ว</p><a class="btn btn-primary" href="race.html?event=${encodeURIComponent(event.id)}">เปิด Race Mode</a>`;}
async function boot(){if(!slug){document.getElementById('eventHeader').innerHTML='<h2>ไม่พบ Event</h2>';return;}try{mini=await TrailMiniApp.init();document.getElementById('miniIdentity').textContent=mini.profile?.displayName?`LINE: ${mini.profile.displayName}`:'เชื่อม LINE แล้ว';}catch(e){document.getElementById('eventHeader').innerHTML=`<h2>ต้องเปิดผ่าน LINE MINI App</h2><p>${UI.esc(e.message)}</p>`;return;}
const {data,error}=await db.from('trail_events').select('*').eq('slug',slug).eq('public_registration_enabled',true).eq('status','registration').is('deleted_at',null).maybeSingle();if(error||!data){document.getElementById('eventHeader').innerHTML=`<h2>Event นี้ยังไม่เปิดรับสมัคร</h2><p>${UI.esc(error?.message||'กรุณาตรวจสอบลิงก์')}</p>`;return;}event=data;document.getElementById('eventHeader').innerHTML=`<div class="eyebrow">เปิดรับสมัคร · LINE MINI App</div><h1 style="margin:8px 0">${UI.esc(event.name)}</h1><p style="color:var(--muted);margin:0">${UI.esc(event.venue||'')} · ${UI.dateTH(event.event_date)} · ทีมละ ${event.team_size} คน · ${Number(event.entry_fee).toLocaleString('th-TH')} บาท</p>`;
try{const me=await TrailMiniApp.call('miniapp-api',{action:'me',event_id:event.id});if(me?.registered){await showExisting(me);return;}}catch(_){}
const fr=await db.from('trail_registration_fields').select('*').eq('event_id',event.id).eq('is_active',true).order('sort_order');fields=fr.data||[];render();}
function render(){const teamFields=fields.filter(f=>f.scope==='team');document.getElementById('teamCustomFields').innerHTML=teamFields.length?`<div class="form-grid">${teamFields.map(f=>inputFor(f,'team')).join('')}</div>`:'';const memberFields=fields.filter(f=>f.scope==='member');document.getElementById('membersWrap').innerHTML=Array.from({length:event.team_size},(_,i)=>`<div class="separator"></div><h3>สมาชิกคนที่ ${i+1}${i===0?' · หัวหน้าทีม (บัญชี LINE นี้)':''}</h3><div class="form-grid member-block" data-order="${i+1}"><div class="field"><label>ชื่อ-นามสกุล *</label><input class="input base-name" required ${i===0&&mini?.profile?.displayName?`value="${UI.esc(mini.profile.displayName)}"`:''}></div><div class="field"><label>เบอร์โทร</label><input class="input base-phone" type="tel"></div><div class="field"><label>อีเมล</label><input class="input base-email" type="email"></div>${memberFields.map(f=>inputFor(f,`m${i+1}`)).join('')}</div>`).join('');document.getElementById('regForm').style.display='block'}
document.getElementById('regForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='กำลังบันทึกใบสมัคร...';try{const teamData=collectCustom(document.getElementById('teamCustomFields'));const members=[...document.querySelectorAll('.member-block')].map(block=>({full_name:block.querySelector('.base-name').value.trim(),phone:block.querySelector('.base-phone').value.trim(),email:block.querySelector('.base-email').value.trim(),participant_data:collectCustom(block)}));const data=await TrailMiniApp.call('miniapp-api',{action:'register',event_id:event.id,team_name:document.getElementById('teamName').value.trim(),team_data:teamData,members});const joinRaw=new URL(`join.html?event=${encodeURIComponent(event.id)}&team=${encodeURIComponent(data.team_code)}#key=${encodeURIComponent(data.team_join_key)}`,location.href).href;const joinLink=await permanent(joinRaw);const raceRaw=new URL(`race.html?event=${encodeURIComponent(event.id)}`,location.href).href;const raceLink=await permanent(raceRaw);document.getElementById('regForm').style.display='none';const box=document.getElementById('resultBox');box.style.display='block';box.innerHTML=`<div class="eyebrow">สมัครสำเร็จ</div><h2>${UI.esc(data.team_code)}</h2><p>บัญชี LINE ของคุณถูกผูกเป็นหัวหน้าทีมแล้ว</p><div class="row-actions"><a class="btn btn-primary" href="${UI.esc(raceLink)}">เปิด Race Mode</a><button id="shareJoinBtn" class="btn" type="button">แชร์ลิงก์ให้คู่ทีม</button></div><div class="separator"></div><div class="help">ลิงก์เชิญใช้สำหรับให้สมาชิกคนอื่นผูก LINE ของตนเองเข้ากับทีมนี้ ห้ามโพสต์ลิงก์เชิญแบบสาธารณะ</div>`;document.getElementById('shareJoinBtn').addEventListener('click',async()=>{try{if(mini.liff.isApiAvailable?.('shareTargetPicker')){await mini.liff.shareTargetPicker([{type:'text',text:`เข้าร่วมทีม ${data.team_code} ใน ${event.name}\n${joinLink}`}]);UI.toast('เปิดหน้าต่างแชร์ LINE แล้ว','success');}else if(navigator.share){await navigator.share({title:event.name,text:`เข้าร่วมทีม ${data.team_code}`,url:joinLink});}else{window.prompt('คัดลอกลิงก์นี้ส่งให้คู่ทีม',joinLink);}}catch(err){UI.toast(err.message||'แชร์ไม่สำเร็จ','error')}});}catch(error){UI.toast(error.message,'error')}finally{btn.disabled=false;btn.textContent='ส่งใบสมัคร';}});boot();})();
</script></body></html>
