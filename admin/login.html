<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Trail RC</title><link rel="stylesheet" href="../assets/app.css"></head><body>
<div class="auth-wrap"><div class="panel auth-card"><div class="brand"><div class="brand-mark">RC</div><div>Trail RC Admin</div></div><h1 style="margin:20px 0 6px">เข้าสู่ระบบผู้ดูแล</h1><p style="color:var(--muted);margin-top:0">ใช้บัญชี Supabase Auth ของผู้ดูแลระบบ</p>
<form id="loginForm" class="form-grid" style="margin-top:18px"><div class="field full"><label>อีเมล</label><input class="input" id="email" type="email" required autocomplete="email"></div><div class="field full"><label>รหัสผ่าน</label><input class="input" id="password" type="password" required autocomplete="current-password"></div><div class="field full"><button class="btn btn-primary" id="loginBtn" type="submit">เข้าสู่ระบบ</button></div><div class="field full"><button class="btn btn-ghost" id="signupBtn" type="button">สร้างบัญชีผู้ดูแลครั้งแรก</button></div><div id="loginMsg" class="help field full"></div></form>
<div class="separator"></div><div class="notice">ติดตั้งครั้งแรก: สร้างผู้ใช้ใน Supabase Auth เพียงครั้งเดียว แล้วเข้าสู่ระบบ จากนั้นกด “รับสิทธิ์ Super Admin คนแรก” ในหน้า Admin หลังจากนั้นการจัดการ Event ทั้งหมดทำบนเว็บไซต์</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase-client.js"></script><script src="../js/common.js"></script><script>
(async()=>{const {data}=await trailDb.auth.getSession();if(data.session) location.href='./index.html';document.getElementById('signupBtn').addEventListener('click',async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('loginMsg');if(!email||password.length<6){msg.className='help field full error';msg.textContent='กรอกอีเมลและรหัสผ่านอย่างน้อย 6 ตัวอักษร';return;}msg.textContent='กำลังสร้างบัญชี...';const {data,error}=await trailDb.auth.signUp({email,password});if(error){msg.className='help field full error';msg.textContent=error.message;return;}msg.className='help field full success';msg.textContent=data.session?'สร้างบัญชีสำเร็จ กำลังเข้าสู่ระบบ...':'สร้างบัญชีแล้ว กรุณายืนยันอีเมล จากนั้นกลับมาเข้าสู่ระบบ';if(data.session)setTimeout(()=>location.href='./index.html',500);});document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('loginBtn'),msg=document.getElementById('loginMsg');btn.disabled=true;msg.textContent='กำลังเข้าสู่ระบบ...';const {error}=await trailDb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});btn.disabled=false;if(error){msg.className='help field full error';msg.textContent=error.message;return;}location.href='./index.html';});})();
</script></body></html>
