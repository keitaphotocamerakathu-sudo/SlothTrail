<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ผูก LINE | Trail RC</title><link rel="stylesheet" href="assets/app.css"></head><body>
<div class="auth-wrap"><div class="panel auth-card"><div class="brand"><div class="brand-mark">RC</div><div>Trail RC · LINE</div></div><h1 style="margin-bottom:8px">ผูกทีมกับ LINE</h1><p style="color:var(--muted)">เมื่อผูกสำเร็จ ระบบจะส่ง Flex Message แจ้งผลหลังสแกน RC ตามที่ Event เปิดใช้งาน</p><div id="bindStatus" class="notice">กำลังเชื่อมต่อ LINE...</div><div id="profileBox" style="margin-top:16px"></div><a id="raceLink" class="btn btn-primary" href="#" style="display:none;width:100%;margin-top:14px">เข้าสู่ Race Mode</a></div></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/common.js"></script><script>
(async()=>{const cfg=window.TRAIL_CONFIG||{},box=document.getElementById('bindStatus');if(!cfg.LINE_LIFF_ID){box.textContent='ยังไม่ได้ตั้ง LINE_LIFF_ID ใน js/config.js';box.classList.add('error');return;}try{await liff.init({liffId:cfg.LINE_LIFF_ID});if(!liff.isLoggedIn()){liff.login();return;}const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,'')),eventId=q.get('event'),teamCode=q.get('team'),teamKey=h.get('key');if(!eventId||!teamCode||!teamKey)throw new Error('ลิงก์ทีมไม่ครบ');const profile=await liff.getProfile();box.textContent=`กำลังผูก ${teamCode} กับ LINE ของ ${profile.displayName}...`;const {data,error}=await trailDb.functions.invoke('bind-line',{body:{event_id:eventId,team_code:teamCode,team_key:teamKey,line_user_id:profile.userId,display_name:profile.displayName}});if(error)throw error;if(!data?.ok)throw new Error(data?.message||data?.error||'ผูก LINE ไม่สำเร็จ');box.textContent='✅ ผูก LINE กับทีมสำเร็จแล้ว';document.getElementById('profileBox').innerHTML=`<div class="help">LINE: ${TrailUI.esc(profile.displayName)} · ทีม ${TrailUI.esc(teamCode)}</div>`;const link=document.getElementById('raceLink');link.href=`race.html?event=${encodeURIComponent(eventId)}&team=${encodeURIComponent(teamCode)}#key=${encodeURIComponent(teamKey)}`;link.style.display='inline-flex'}catch(e){console.error(e);box.textContent='❌ '+(e.message||String(e));box.classList.add('error')}})();
</script></body></html>
