<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Race Mode | Trail RC MINI App</title><link rel="stylesheet" href="assets/app.css"><style>#reader video{border-radius:14px}#reader{overflow:hidden}.mini-only{font-size:.86rem;color:var(--muted)}</style></head><body>
<div class="race-shell"><div class="brand" style="margin-bottom:14px"><div class="brand-mark">RC</div><div id="raceTitle">Trail RC · LINE MINI App</div></div>
<section class="panel race-card"><div class="race-hero"><div><div class="help" id="teamCode">กำลังตรวจสอบ LINE...</div><h2 id="teamName" style="margin:4px 0">-</h2></div><div><div class="help">คะแนนรวม</div><div class="race-score" id="score">0</div></div></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div class="help" id="progressText" style="margin-top:7px">0 / 0 RC</div></section>
<section class="panel race-card"><div class="eyebrow" id="rcLabel">RC ถัดไป</div><h2 id="rcName">กำลังโหลด...</h2><div id="clue" class="clue">-</div><div class="notice" id="distance" style="margin-top:12px">ระยะทาง: -</div></section>
<section class="panel race-card"><div class="scan-box"><div id="reader"></div><button id="scanBtn" class="btn btn-primary" type="button" style="width:100%">สแกน QR ด้วย LINE</button><button id="fallbackScanBtn" class="btn btn-ghost" type="button" style="width:100%;margin-top:8px;display:none">ใช้กล้องเว็บสำหรับทดสอบ</button><button id="stopBtn" class="btn btn-ghost" type="button" style="width:100%;margin-top:8px;display:none">หยุดกล้อง</button><div id="scanStatus" class="scan-status"></div><div id="clientHint" class="mini-only" style="margin-top:8px"></div></div></section>
<section class="panel race-card"><button id="refreshBtn" class="btn" type="button" style="width:100%">รีเฟรชสถานะ</button></section></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/common.js?v=20260909-manual1"></script><script src="js/line-miniapp.js?v=20260909-manual1"></script><script>
(()=>{const UI=TrailUI,eventId=UI.qs('event');let scanner=null,busy=false,mini=null,lastStatus=null;const $=id=>document.getElementById(id);
async function call(action,extra={}){return TrailMiniApp.call('miniapp-api',{action,event_id:eventId,...extra})}
function formatStart(iso){if(!iso)return '-';try{return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(iso))}catch{return new Date(iso).toLocaleTimeString()}}
function renderRaceAccess(access){
  if(!access?.can_scan){
    $('scanBtn').disabled=true;
    if(access?.state==='waiting_admin'){
      $('scanStatus').textContent=access.scheduled_at?`⏳ รอ Admin ปล่อยตัว · คิวโดยประมาณ ${formatStart(access.scheduled_at)}`:'⏳ รอ Admin ปล่อยตัว';
      return;
    }
    $('scanStatus').textContent=access?.state==='event_not_live'?'Event ยังไม่เข้าสู่โหมดการแข่งขัน':access?.message||'ยังไม่สามารถสแกน QR ได้';
    return;
  }
  $('scanBtn').disabled=false;
  $('scanStatus').textContent=`🟢 ปล่อยตัวแล้ว${access.actual_released_at?` · เวลา ${formatStart(access.actual_released_at)}`:''} · พร้อมสแกน QR`;
}
async function status(){try{const data=await call('status');lastStatus=data;$('raceTitle').textContent=data.event.name;$('teamCode').textContent=data.team.team_code;$('teamName').textContent=data.team.team_name||'ทีมของคุณ';$('score').textContent=data.team.total_score;const pct=data.progress.total?Math.round(data.progress.passed/data.progress.total*100):0;$('progressBar').style.width=pct+'%';$('progressText').textContent=`${data.progress.passed} / ${data.progress.total} RC · ${data.race_access?.can_scan?'กำลังแข่งขัน':data.team.status}`;if(data.next_checkpoint){$('rcLabel').textContent=`RC ${data.next_checkpoint.checkpoint_no} · ${data.next_checkpoint.points} คะแนน`;$('rcName').textContent=data.next_checkpoint.name;$('clue').textContent=data.next_checkpoint.clue||'ไม่มีคำใบ้';$('distance').textContent=`ระยะทาง: ${data.next_checkpoint.distance_text||'ไม่ระบุ'}`}else{$('rcLabel').textContent='ครบทุก RC';$('rcName').textContent='การแข่งขันส่วนของทีมเสร็จแล้ว';$('clue').textContent='ตรวจสอบคะแนนและรอผลจากกรรมการ';$('distance').textContent='';$('scanBtn').disabled=true;return}renderRaceAccess(data.race_access)}catch(e){$('scanStatus').textContent='❌ '+e.message;$('scanBtn').disabled=true}}
function getPosition(){return new Promise(resolve=>{if(!navigator.geolocation){resolve({});return;}navigator.geolocation.getCurrentPosition(p=>resolve({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy}),()=>resolve({}),{enableHighAccuracy:true,timeout:7000,maximumAge:5000})})}
async function onScan(text){if(busy||!text)return;busy=true;try{await stopScanner();$('scanStatus').textContent='กำลังตรวจ QR...';const pos=lastStatus?.event?.gps_validation_enabled?await getPosition():{};const data=await call('scan',{qr_text:text,...pos});$('scanStatus').textContent=(data.result==='passed'?'✅ ':data.result==='decoy'?'⚠️ ':'❌ ')+(data.message||data.result);if(data.points_delta!=null)$('scanStatus').textContent+=` · ${data.points_delta>0?'+':''}${data.points_delta} คะแนน`;await status()}catch(e){$('scanStatus').textContent='❌ '+e.message}finally{busy=false}}
async function scanWithLine(){try{if(!mini?.liff?.isApiAvailable?.('scanCodeV2')){$('scanStatus').textContent='LINE เวอร์ชันนี้ไม่รองรับ scanCodeV2';$('fallbackScanBtn').style.display='inline-flex';return;}const result=await mini.liff.scanCodeV2();if(result?.value)await onScan(result.value);else $('scanStatus').textContent='ไม่ได้อ่านค่า QR';}catch(e){$('scanStatus').textContent='สแกนไม่สำเร็จ: '+(e.message||e)}}
async function startFallback(){if(!window.Html5Qrcode){$('scanStatus').textContent='ไม่สามารถโหลดตัวสแกน QR';return;}if(scanner)return;scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},onScan,()=>{});$('fallbackScanBtn').style.display='none';$('stopBtn').style.display='inline-flex';$('scanStatus').textContent='โหมดทดสอบ: เล็งกล้องไปที่ QR'}catch(e){scanner=null;$('scanStatus').textContent='เปิดกล้องไม่สำเร็จ: '+e}}
async function stopScanner(){if(scanner){try{await scanner.stop();await scanner.clear()}catch{}scanner=null;$('reader').innerHTML=''}$('stopBtn').style.display='none'}
$('scanBtn').addEventListener('click',scanWithLine);$('fallbackScanBtn').addEventListener('click',startFallback);$('stopBtn').addEventListener('click',stopScanner);$('refreshBtn').addEventListener('click',status);
(async()=>{if(!eventId){$('scanStatus').textContent='ไม่พบ Event ในลิงก์';$('scanBtn').disabled=true;return;}try{mini=await TrailMiniApp.init();$('clientHint').textContent=mini.inClient?'กำลังใช้งานภายใน LINE MINI App':'เปิดผ่านเบราว์เซอร์ภายนอก — Scan QR ของ LINE อาจใช้ไม่ได้';if(!mini.inClient)$('fallbackScanBtn').style.display='inline-flex';await status();}catch(e){$('scanStatus').textContent='❌ '+e.message;$('scanBtn').disabled=true;}})();})();
</script></body></html>
