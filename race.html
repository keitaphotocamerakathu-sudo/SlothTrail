<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Race Mode | Trail RC</title><link rel="stylesheet" href="assets/app.css"><style>#reader video{border-radius:14px}#reader{overflow:hidden}</style></head><body>
<div class="race-shell"><div class="brand" style="margin-bottom:14px"><div class="brand-mark">RC</div><div id="raceTitle">Trail RC Race Mode</div></div>
<section class="panel race-card"><div class="race-hero"><div><div class="help" id="teamCode">กำลังตรวจสอบทีม...</div><h2 id="teamName" style="margin:4px 0">-</h2></div><div><div class="help">คะแนนรวม</div><div class="race-score" id="score">0</div></div></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div class="help" id="progressText" style="margin-top:7px">0 / 0 RC</div></section>
<section class="panel race-card"><div class="eyebrow" id="rcLabel">RC ถัดไป</div><h2 id="rcName">กำลังโหลด...</h2><div id="clue" class="clue">-</div><div class="notice" id="distance" style="margin-top:12px">ระยะทาง: -</div></section>
<section class="panel race-card"><div class="scan-box"><div id="reader"></div><button id="scanBtn" class="btn btn-primary" type="button" style="width:100%">เปิดกล้องสแกน QR</button><button id="stopBtn" class="btn btn-ghost" type="button" style="width:100%;margin-top:8px;display:none">หยุดกล้อง</button><div id="scanStatus" class="scan-status"></div></div></section>
<section class="panel race-card"><button id="refreshBtn" class="btn" type="button" style="width:100%">รีเฟรชสถานะ</button></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/common.js"></script><script>
(()=>{const db=trailDb,UI=TrailUI;const eventId=UI.qs('event'),teamCode=UI.qs('team'),hash=new URLSearchParams(location.hash.replace(/^#/,'')),teamKey=hash.get('key');let scanner=null,busy=false,lastStatus=null;const $=id=>document.getElementById(id);
async function call(action,extra={}){const {data,error}=await db.functions.invoke('verify-qr',{body:{action,event_id:eventId,team_code:teamCode,team_key:teamKey,...extra}});if(error){let msg=error.message;try{const body=await error.context?.json();msg=body?.message||body?.error||msg}catch{}throw new Error(msg)}return data}
async function status(){try{const data=await call('status');lastStatus=data;$('raceTitle').textContent=data.event.name;$('teamCode').textContent=data.team.team_code;$('teamName').textContent=data.team.team_name||'ทีมของคุณ';$('score').textContent=data.team.total_score;const pct=data.progress.total?Math.round(data.progress.passed/data.progress.total*100):0;$('progressBar').style.width=pct+'%';$('progressText').textContent=`${data.progress.passed} / ${data.progress.total} RC · สถานะ ${data.team.status}`;if(data.next_checkpoint){$('rcLabel').textContent=`RC ${data.next_checkpoint.checkpoint_no} · ${data.next_checkpoint.points} คะแนน`;$('rcName').textContent=data.next_checkpoint.name;$('clue').textContent=data.next_checkpoint.clue||'ไม่มีคำใบ้';$('distance').textContent=`ระยะทาง: ${data.next_checkpoint.distance_text||'ไม่ระบุ'}`}else{$('rcLabel').textContent='ครบทุก RC';$('rcName').textContent='การแข่งขันส่วนของทีมเสร็จแล้ว';$('clue').textContent='ตรวจสอบคะแนนและรอผลจากกรรมการ';$('distance').textContent='';$('scanBtn').disabled=true}if(data.team.status!=='racing'){$('scanStatus').textContent=data.team.status==='finished'?'🏁 จบการแข่งขันแล้ว':'รอ Admin ปล่อยตัวก่อนจึงจะสแกนได้';$('scanBtn').disabled=true}else $('scanBtn').disabled=false}catch(e){$('scanStatus').textContent='❌ '+e.message;$('scanBtn').disabled=true}}
function getPosition(){return new Promise(resolve=>{if(!navigator.geolocation){resolve({});return;}navigator.geolocation.getCurrentPosition(p=>resolve({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy}),()=>resolve({}),{enableHighAccuracy:true,timeout:7000,maximumAge:5000})})}
async function onScan(text){if(busy)return;busy=true;try{await stopScanner();$('scanStatus').textContent='กำลังตรวจ QR...';const pos=await getPosition();const data=await call('scan',{qr_text:text,...pos});$('scanStatus').textContent=(data.result==='passed'?'✅ ':data.result==='decoy'?'⚠️ ':'❌ ')+(data.message||data.result);if(data.points_delta!=null)$('scanStatus').textContent+=` · ${data.points_delta>0?'+':''}${data.points_delta} คะแนน`;await status()}catch(e){$('scanStatus').textContent='❌ '+e.message}finally{busy=false}}
async function startScanner(){if(!window.Html5Qrcode){$('scanStatus').textContent='ไม่สามารถโหลดตัวสแกน QR';return;}if(scanner)return;scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},onScan,()=>{});$('scanBtn').style.display='none';$('stopBtn').style.display='inline-flex';$('scanStatus').textContent='เล็งกล้องไปที่ QR'}catch(e){scanner=null;$('scanStatus').textContent='เปิดกล้องไม่สำเร็จ: '+e}}
async function stopScanner(){if(scanner){try{await scanner.stop();await scanner.clear()}catch{}scanner=null;$('reader').innerHTML=''}$('scanBtn').style.display='inline-flex';$('stopBtn').style.display='none'}
$('scanBtn').addEventListener('click',startScanner);$('stopBtn').addEventListener('click',stopScanner);$('refreshBtn').addEventListener('click',status);if(!eventId||!teamCode||!teamKey){$('scanStatus').textContent='ลิงก์ทีมไม่ครบ กรุณาเปิดจากลิงก์ที่ได้หลังสมัคร';$('scanBtn').disabled=true}else status();})();
</script></body></html>
